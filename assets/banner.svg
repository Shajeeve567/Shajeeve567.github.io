<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="shajeeve.b — you found the source code. bold move.">
  <style>
    .orb{filter:url(#blur)}
    .o1{animation:d1 14s ease-in-out infinite alternate}
    .o2{animation:d2 18s ease-in-out infinite alternate}
    .o3{animation:d3 22s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(120px,40px)}}
    @keyframes d2{to{transform:translate(-140px,-30px)}}
    @keyframes d3{to{transform:translate(80px,-50px)}}
    .cur{animation:b 1.1s step-end infinite}
    @keyframes b{50%{opacity:0}}
    .fade{opacity:0;animation:f 1s ease forwards 1.2s}
    @keyframes f{to{opacity:1}}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#17201B" fill-opacity=".10"/></pattern>
    <clipPath id="r"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="260" fill="#F3F4EF"/>
    <circle class="orb o1" cx="160" cy="60" r="120" fill="#BCD6C8"/>
    <circle class="orb o2" cx="760" cy="130" r="130" fill="#C7D6EA"/>
    <circle class="orb o3" cx="460" cy="250" r="120" fill="#EBE1CB"/>
    <rect width="900" height="260" fill="url(#dots)"/>
    <text x="60" y="118" font-size="54" font-weight="700" fill="#17201B"><tspan fill="#2F6B57">&gt;_</tspan>shajeeve<tspan fill="#2F6B57">.</tspan>b<tspan class="cur" fill="#2F6B57">▌</tspan></text>
    <text class="fade" x="62" y="168" font-size="20" fill="#55605A">// you found the source code. bold move.</text>
    <text class="fade" x="62" y="200" font-size="15" fill="#55605A">backend · distributed systems · AI engineering</text>
  </g>
</svg>
